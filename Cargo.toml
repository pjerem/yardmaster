[workspace]
members = ["crates/yard-core", "crates/yard-daemon", "crates/yard-tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
yard-core = { path = "crates/yard-core" }
yard-daemon = { path = "crates/yard-daemon" }
yard-tui = { path = "crates/yard-tui" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
wiremock = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[package]
name = "yardmaster"
description = "Orchestrates N coding agents on N tickets, from intake to merge. Never drives a train."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "yard"
path = "src/main.rs"

[dependencies]
yard-core.workspace = true
yard-daemon.workspace = true
yard-tui.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
cucumber = "0.21"
futures = "0.3"
# BDD suite: event-log assertions read the daemon's sqlite db directly.
rusqlite.workspace = true
# BDD suite: pid liveness checks + SIGKILL fallback in scenario cleanup.
libc = "0.2"
# E2E BDD: mocks the GitHub ticket + forge APIs on localhost.
wiremock.workspace = true

[[test]]
name = "bdd"
harness = false
